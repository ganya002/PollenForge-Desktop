<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob: http://127.0.0.1:8765 http://localhost:5173; script-src 'self' file:; style-src 'self' file: 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' file: data: blob: http://127.0.0.1:8765 https:; connect-src 'self' file: http://127.0.0.1:8765 ws://127.0.0.1:8765 http://localhost:5173 ws://localhost:5173 https://api.github.com; font-src 'self' file: data: https://fonts.gstatic.com;" />
    <title>Nexum</title>
  </head>
  <body style="margin:0;background:#111111;color:#e8e8e8;font-family:'Segoe UI',sans-serif">
    <div id="root">
      <div style="padding:48px;font-size:16px">Starting Nexum…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Liquid Glass refraction filters -->
    <svg width="0" height="0" style="position:absolute;overflow:hidden;pointer-events:none" aria-hidden="true">
      <defs>
        <filter id="glass-refraction-subtle" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="1" seed="12" result="turbulence" />
          <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="1.2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        </filter>
        <filter id="glass-refraction-dramatic" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="turbulence" />
          <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feGaussianBlur in="displaced" stdDeviation="0.3" result="soft" />
          <feComponentTransfer in="soft" result="final">
            <feFuncA type="discrete" tableValues="1 1" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>
  </body>
</html>
