name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version if this tag already exists
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          CURRENT="$(node -p "require('./package.json').version")"
          if git rev-parse "v${CURRENT}" >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(git status --porcelain)" != "" ]; then
            git add package.json package-lock.json
            git commit -m "chore: release v${VERSION}"
            git push origin HEAD:main
          fi
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            artifact: mac
          - os: windows-latest
            args: --win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package ${{ matrix.artifact }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/latest.yml
            release/latest-mac.yml
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.blockmap

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -type f \
            \( -name 'latest.yml' -o -name 'latest-mac.yml' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.blockmap' \) \
            ! -name 'builder-debug.yml' \
            -exec cp -n {} upload/ \;
          ls -la upload

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sed -e "s/\${VERSION}/${VERSION}/g" -e "s|\${BASE}|${BASE}|g" .github/release-notes.md > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "PollenForge ${VERSION}" \
              --notes-file notes.md
            gh release upload "$TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" upload/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "PollenForge ${VERSION}" \
              --notes-file notes.md
          fi
